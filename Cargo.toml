[package]
name = "cadviewer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A minimal, portable DWG viewer and vector PDF converter for Windows"
repository = "https://github.com/LibreDWG/libredwg"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
encoding_rs = "0.8"
flate2 = "1"
pdf-writer = "0.12"
rfd = "0.17.2"
subsetter = "0.2"
tempfile = "3.27.0"
tiny-skia = "0.11"
ttf-parser = "0.25"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

