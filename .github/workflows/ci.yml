name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Key on the PR number when this run is for a pull request: a push and its
# open PR both build the same commit, but push events see github.ref as
# refs/heads/<branch> while pull_request events see refs/pull/<n>/merge, so
# keying on github.ref alone puts them in different groups and both run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: clippy + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # build.rs reads the commit for the version stamp; a shallow checkout
      # still has HEAD, which is all it needs.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
