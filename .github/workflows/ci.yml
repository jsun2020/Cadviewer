name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: clippy + tests
    runs-on: windows-latest
    # A commit in this repository fires both `push` and, if a PR tracks the
    # branch, `pull_request`. They cannot share a concurrency group, because
    # `github.ref` differs between the two events, so the duplicate has to be
    # declined rather than cancelled. `push` covers everything in this
    # repository; the only thing it cannot see is a PR opened from a fork,
    # whose commits never land here. So: run on every push, and run on
    # pull_request only when the PR comes from somewhere else.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # build.rs reads the commit for the version stamp; a shallow checkout
      # still has HEAD, which is all it needs.
      #
      # --locked here too (N2): clippy runs first and shares cargo test's
      # resolver, so without --locked here it would silently regenerate a
      # stale Cargo.lock before the Tests step's --locked ever saw it,
      # making that guard permanently inert.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # --locked: fail on a Cargo.lock that does not match Cargo.toml with
      # cargo's own clear message, rather than letting cargo regenerate the
      # lock file and leave the tree dirty for a later, unrelated-looking
      # check to trip over (I2).
      - name: Tests
        run: cargo test --locked
