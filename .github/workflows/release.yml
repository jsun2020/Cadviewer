name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: package and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Fails the release rather than shipping an untested build. --locked:
      # a stale Cargo.lock (e.g. after a version bump in Cargo.toml) fails
      # here with cargo's own clear message, instead of being silently
      # regenerated and leaving the tree dirty for verify-release.ps1 to
      # trip over later with a message that points nowhere near the cause
      # (I2).
      - name: Tests
        run: cargo test --locked

      # Downloads the LibreDWG runtime and its corresponding source, both
      # SHA-256 pinned, then builds, stages, gates and zips. The same script
      # a developer runs locally, so the release cannot drift from it.
      - name: Package
        run: .\scripts\package.ps1

      - name: Verify the version the artifact reports
        run: >
          .\scripts\verify-release.ps1
          -Tag "${{ github.ref_name }}"
          -ConvertExe ".\dist\Cadviewer-portable-win64\Cadconvert.exe"
          -CommitSha "${{ github.sha }}"

      - name: Smoke test the packaged zip
        run: >
          .\scripts\smoke-test.ps1
          -Zip ".\dist\Cadviewer-portable-win64.zip"
          -SourceArchive ".\third_party\libredwg-0.14.tar.xz"

      - name: Checksum
        run: |
          $Hash = (Get-FileHash -Algorithm SHA256 .\dist\Cadviewer-portable-win64.zip).Hash.ToLowerInvariant()
          # Set-Content -Encoding ASCII appends a CRLF line ending, which
          # sha256sum -c rejects ("no properly formatted checksum lines
          # found"). Write the bytes directly with an explicit LF instead.
          $ShaPath = [System.IO.Path]::GetFullPath(".\dist\Cadviewer-portable-win64.zip.sha256")
          [System.IO.File]::WriteAllText($ShaPath, "$Hash  Cadviewer-portable-win64.zip`n")
          Write-Host $Hash

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          ".\dist\Cadviewer-portable-win64.zip"
          ".\dist\Cadviewer-portable-win64.zip.sha256"
          --title "Cadviewer ${{ github.ref_name }}"
          --notes-file .github/release-notes.md
          --generate-notes
